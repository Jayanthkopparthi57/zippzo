version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: zippzo-postgres
    environment:
      POSTGRES_DB: zippzo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - zippzo_pg_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: zippzo-redis
    ports:
      - "6379:6379"
    volumes:
      - zippzo_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: .
    container_name: zippzo-backend
    command: sh -c "python manage.py migrate && daphne -b 0.0.0.0 -p 8000 zippzo_wms.asgi:application"
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=zippzo
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SECRET_KEY=change-me-in-production
      - DEBUG=False
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD", "python", "manage.py", "check"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  outbox-worker:
    build: .
    container_name: zippzo-outbox-worker
    command: python manage.py publish_outbox --loop --interval 1
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=zippzo
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SECRET_KEY=change-me-in-production
      - DEBUG=False
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    restart: unless-stopped

volumes:
  zippzo_pg_data:
  zippzo_redis_data:
