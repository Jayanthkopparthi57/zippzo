# Render blueprint for 100% Free Tier ($0/mo).
#
# Free Tier Support on Render:
# - Web service: 'plan: free' (750 free hours/mo, spins down on 15m idle)
# - PostgreSQL: 'plan: free' (1GB storage)
# - Key Value / Redis: 'plan: free' (25MB in-memory)
# Note: Render does NOT permit 'plan: free' on background workers or cron jobs.
# Those paid services are excluded so this blueprint deploys entirely on $0/month.
services:
  - type: web
    name: zippzo-wms
    runtime: python
    buildCommand: >-
      pip install -r requirements.txt &&
      cd frontend && npm ci && npm run build && cd .. &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate &&
      python manage.py dedupe_user_emails --apply &&
      python manage.py cleanup_test_accounts --apply &&
      if [ -n "$DJANGO_SUPERADMIN_EMAIL" ] && [ -n "$DJANGO_SUPERADMIN_PASSWORD" ]; then \
        python manage.py bootstrap_admin \
          --email "$DJANGO_SUPERADMIN_EMAIL" \
          --name "${DJANGO_SUPERADMIN_NAME:-Admin}" \
          --password-from-env DJANGO_SUPERADMIN_PASSWORD; \
      else \
        echo "Super Admin bootstrap skipped: env vars not set"; \
      fi
    startCommand: daphne -b 0.0.0.0 -p $PORT zippzo_wms.asgi:application
    envVars:
      - key: DJANGO_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DJANGO_BEHIND_SSL
        value: "true"
      - key: DJANGO_SUPERADMIN_EMAIL
        value: ""
      - key: DJANGO_SUPERADMIN_NAME
        value: ""
      - key: DJANGO_SUPERADMIN_PASSWORD
        value: ""
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: zippzo-wms-ha2c.onrender.com,.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: capacitor://localhost,https://localhost,http://localhost
      - key: DB_SSLMODE
        value: require
      - key: DATABASE_URL
        fromDatabase:
          name: zippzo-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: zippzo-redis
          property: connectionString
    healthCheckPath: /api/health/
    plan: free
    region: singapore
    autoDeploy: true

  - type: keyvalue
    name: zippzo-redis
    plan: free
    region: singapore
    ipAllowList: []

databases:
  - name: zippzo-postgres
    databaseName: zippzo
    user: zippzo_user
    plan: free
    region: singapore
    postgresMajorVersion: "16"
