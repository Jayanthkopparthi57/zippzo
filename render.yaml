# Render blueprint.
#
# Build order matters: the SPA must exist before collectstatic and before the
# process starts, because Django serves frontend/dist through WhiteNoise.
services:
  - type: web
    name: zippzo-wms
    runtime: python
    buildCommand: >-
      pip install -r requirements.txt &&
      cd frontend && npm ci && npm run build && cd .. &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate
    startCommand: daphne -b 0.0.0.0 -p $PORT zippzo_wms.asgi:application
    envVars:
      - key: DJANGO_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DJANGO_BEHIND_SSL
        value: "true"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: zippzo-wms.onrender.com,.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: capacitor://localhost,https://localhost,http://localhost
      - key: DB_SSLMODE
        value: require
      - key: DATABASE_URL
        fromDatabase:
          name: zippzo-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: zippzo-redis
          property: connectionString
    healthCheckPath: /api/health/
    plan: starter
    region: singapore
    autoDeploy: true

  - type: worker
    name: zippzo-outbox-worker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py publish_outbox --loop --interval 1
    envVars:
      - key: DJANGO_ENV
        value: production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: zippzo-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: zippzo-redis
          property: connectionString
    plan: starter
    region: singapore

  - type: cron
    name: zippzo-pick-queue
    runtime: python
    schedule: "* * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py recheck_pick_queue
    envVars:
      - key: DJANGO_ENV
        value: production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: zippzo-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: zippzo-redis
          property: connectionString
    region: singapore

  - type: cron
    name: zippzo-cashfree-expiry
    runtime: python
    schedule: "*/5 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py expire_cashfree_orders
    envVars:
      - key: DJANGO_ENV
        value: production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: zippzo-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: zippzo-redis
          property: connectionString
    region: singapore

  - type: keyvalue
    name: zippzo-redis
    plan: starter
    region: singapore
    ipAllowList: []

databases:
  - name: zippzo-postgres
    databaseName: zippzo
    user: zippzo_user
    plan: starter
    region: singapore
    version: "16"
